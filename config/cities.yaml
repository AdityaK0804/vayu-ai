# AirSight — city registry
# THIS FILE IS THE SCALABILITY STORY.
# Adding a city = adding ~8 lines here. No code changes anywhere.
# Show this file to the judges when they ask "does it scale to other cities?"

defaults:
  # Training window: CPCB pm25 is empty before Oct 2022 regardless of what
  # the filenames claim, and now runs through 2025.
  start_date: "2022-10-01"
  end_date: "2025-12-31"
  h3_resolution: 8      # ~0.74 km2 per cell ≈ the PS's "1km grid"
  timezone: "Asia/Kolkata"

cities:
  - id: korba
    name: "Korba"
    role: hero
    lat: 22.3595
    lon: 82.7501
    bbox: [82.3, 22.0, 83.1, 22.7]      # [W, S, E, N]
    has_stations: true
    notes: "India's power capital. Coal plants + SECL mines. Extreme industrial PM. Few stations = the hard case."

  - id: raipur
    name: "Raipur"
    role: validation
    lat: 21.2514
    lon: 81.6296
    bbox: [81.2, 20.9, 82.0, 21.6]      # [W, S, E, N]
    has_stations: true
    notes: "State capital. Most stations. Best-behaved validation city."

  - id: jagdalpur
    name: "Jagdalpur"
    role: reveal
    lat: 19.0748
    lon: 82.0261
    bbox: [81.7, 18.8, 82.4, 19.4]      # [W, S, E, N]
    has_stations: false
    notes: "NO CPCB station. We forecast it blind from satellite+met. This is the mic-drop."

  - id: bhilai
    name: "Bhilai"
    role: validation_optional
    lat: 21.1938
    lon: 81.3509
    bbox: [81.0, 20.9, 81.7, 21.5]      # [W, S, E, N]
    has_stations: true
    notes: "Bhilai Steel Plant. Strong industrial signal."

  - id: bilaspur
    name: "Bilaspur"
    role: validation_optional
    lat: 22.0797
    lon: 82.1409
    bbox: [81.7, 21.8, 82.5, 22.4]      # [W, S, E, N]
    has_stations: true

  - id: tumidih
    name: "Tumidih"
    role: validation
    lat: 22.06631475
    lon: 83.33820077
    bbox: [83.1382, 21.8663, 83.5382, 22.2663]      # [W, S, E, N]
    has_stations: true
    notes: "Industrial station at Tumidih."

  - id: milupara
    name: "Milupara"
    role: validation
    lat: 22.1910172
    lon: 83.5197009
    bbox: [83.3197, 21.991, 83.7197, 22.391]      # [W, S, E, N]
    has_stations: true
    notes: "Industrial station at Milupara."

  - id: chhal
    name: "Chhal"
    role: validation
    lat: 22.118125
    lon: 83.140608
    bbox: [82.9406, 21.9181, 83.3406, 22.3181]      # [W, S, E, N]
    has_stations: true
    notes: "Industrial station at Chhal."

  - id: kunjemara
    name: "Kunjemura"
    role: validation
    lat: 22.12665
    lon: 83.483212
    bbox: [83.2832, 21.9267, 83.6832, 22.3267]      # [W, S, E, N]
    has_stations: true
    notes: "Industrial station at Kunjemara."

# State-wide bbox — used for FIRMS fire + EDGAR clipping (one download covers all)
state:
  name: "Chhattisgarh"
  bbox: [80.2, 17.8, 84.4, 24.1]
